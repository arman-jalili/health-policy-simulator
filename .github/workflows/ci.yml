name: CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint · Types · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: Retrieval recall evaluation
        run: uv run python scripts/evaluate_retrieval.py > retrieval-recall.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-retrieval-recall
          path: backend/retrieval-recall.json

  architecture:
    name: Architecture validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Architecture validation
        run: bash .pi/scripts/validate-architecture.sh
      - name: DDD layer structure
        run: bash .pi/scripts/ci/check_ddd_structure.sh
      - name: ADR-008 modeling depth
        run: uv run python .pi/scripts/ci/check_modeling_depth.py
      - name: No credentials in the tree
        run: |
          set -euo pipefail
          if git grep -nI -E '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ; then
            echo "::error::a credential-shaped string is tracked; remove it and rotate the key"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(\.env|demo\.env\.local)$'; then
            echo "::error::a local env file is tracked; it belongs in .gitignore"
            exit 1
          fi
          echo "no credentials tracked"
      - name: Canonical references
        run: bash .pi/scripts/validate-canonical.sh
      - name: Collaborator reachability (W8)
        run: uv run python .pi/scripts/ci/check_collaborator_reachability.py
      # Loop, never a hand-maintained module list: a new proofing script is gated the moment it
      # lands.
      - name: Module contract proofing
        run: |
          set -euo pipefail
          for script in .pi/scripts/ci/check_*_contracts.sh; do
            echo "::group::$script"
            bash "$script"
            echo "::endgroup::"
          done
          for script in .pi/scripts/ci/check_*_contract.py; do
            echo "::group::$script"
            uv run python "$script"
            echo "::endgroup::"
          done
      - name: Contract proofing gate
        run: uv run python .pi/scripts/ci/check_contract_proofing_gate.py

  migrations:
    name: Migrations (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hps
          POSTGRES_PASSWORD: hps
          POSTGRES_DB: health_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hps -d health_policy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hps:hps@localhost:5432/health_policy
      AUTH_MODE: strict
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Revert migrations
        run: uv run alembic downgrade base
      - name: Re-apply migrations
        run: uv run alembic upgrade head
      - name: Migration and outbox integration tests
        run: uv run pytest -m integration

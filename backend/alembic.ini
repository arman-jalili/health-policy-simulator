# Alembic configuration.
#
# The database URL is intentionally NOT stored here: it is read from DATABASE_URL via
# ``shared.config.Settings`` inside ``migrations/env.py`` so that migrations, the API and the
# tests all resolve the same value and a missing URL fails fast.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[post_write_hooks]
